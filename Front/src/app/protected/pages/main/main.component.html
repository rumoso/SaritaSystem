<mat-sidenav-container fullscreen>

    <!-- ══════════════════════ MENÚ LATERAL ══════════════════════ -->
    <mat-sidenav #sidenav mode="push" class="app-sidenav">

        <div class="sidemenu-header">
            <img class="sidemenu-logo" [src]="_IconApp" alt="">
            <span class="sidemenu-title">{{ _appName }}</span>
            <span class="sidemenu-spacer"></span>
            <button mat-icon-button class="sidemenu-close" (click)="sidenav.toggle()">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <div class="sidemenu-body">

            <mat-expansion-panel [class.mat-elevation-z0]="true"
                                 *ngFor="let menuDad of _menuList"
                                 class="sidemenu-group">
                <mat-expansion-panel-header class="sidemenu-group-header">
                    <mat-panel-title class="sidemenu-group-title">
                        {{ menuDad.name }}
                    </mat-panel-title>
                </mat-expansion-panel-header>

                <a class="sidemenu-item"
                   *ngFor="let subMenu of menuDad.subMenus"
                   (click)="changeRoute(subMenu.linkList)">
                    <span class="sidemenu-item-dot"></span>
                    <span class="sidemenu-item-text">{{ subMenu.name }}</span>
                </a>
            </mat-expansion-panel>

        </div>

    </mat-sidenav>

    <!-- ══════════════════════ TOPBAR ══════════════════════ -->
    <mat-toolbar id="headerApp" class="app-topbar">

        <button mat-icon-button class="topbar-menu-btn" (click)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
        </button>

        <div class="topbar-brand manitaSobre" routerLink="./dashboard">
            <img class="topbar-logo" [src]="_IconApp" alt="">
            <span class="topbar-title">{{ _appName }}</span>
        </div>

        <!-- Nombre de la pantalla actual: se muestra aquí en vez de
             dentro de cada pantalla, para ahorrar ese espacio. Cada
             pantalla lo publica con PageTitleService. -->
        <ng-container *ngIf="pageTitleServ.title">
            <div class="topbar-divider"></div>

            <button mat-icon-button class="topbar-back-btn" (click)="fn_volverDashboard()" matTooltip="Volver al menú">
                <mat-icon>arrow_back</mat-icon>
            </button>

            <div class="topbar-page-title">
                <mat-icon class="topbar-page-title-icon">{{ pageTitleServ.icon }}</mat-icon>
                <div class="topbar-page-title-text">
                    <span class="topbar-page-name">{{ pageTitleServ.title }}</span>
                    <span class="topbar-page-desc" *ngIf="pageTitleServ.desc">{{ pageTitleServ.desc }}</span>
                </div>
            </div>
        </ng-container>

        <span class="topbar-spacer"></span>

        <div class="topbar-user manitaSobre" (click)="showChangePwdModal()" matTooltip="Mi cuenta">
            <div class="topbar-avatar">{{ userLogin?.name?.charAt(0)?.toUpperCase() }}</div>
            <span class="topbar-user-name hide-on-small">{{ userLogin?.name }}</span>
        </div>

        <button mat-icon-button class="topbar-logout-btn" (click)="logout()" matTooltip="Cerrar sesión">
            <mat-icon>logout</mat-icon>
        </button>

    </mat-toolbar>

    <div class="container-fluid app-content">
        <router-outlet></router-outlet>
    </div>

</mat-sidenav-container>
